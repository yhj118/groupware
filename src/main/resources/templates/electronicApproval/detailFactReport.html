<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>경위/시말서 상세보기</title>
    <link rel="stylesheet" href="/tabler/css/tabler.min.css">
    <script th:src="@{/js/approval-edit.js}" defer></script>
</head>
<body style="margin:0">
<!-- 고정 예시 UI: 조회 데이터 바인딩 없이 팝업 프래그먼트만 유지 -->
<section class="approval-detail-root" th:fragment="detail" data-approval-detail th:with="canProcessApproval=${loginEmployee != null and viewApprovalData.approverEmployeeId == loginEmployee.employeeId and viewApprovalData.approvalStatus == 'PENDING'}">
    <style>
        .approval-detail-root { --detail-border: var(--tblr-border-color, #e2e8f0); --detail-surface: var(--tblr-bg-surface, #fff); --detail-muted: var(--tblr-secondary, #667382); max-width: 1060px; margin: 0 auto; padding: 28px; color: var(--tblr-body-color, #182433); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .approval-detail-root * { box-sizing: border-box; }
        .approval-detail-root .detail-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
        .approval-detail-root .detail-eyebrow { color: var(--detail-muted); font-size: 12px; letter-spacing: .08em; font-weight: 600; }
        .approval-detail-root .detail-document-number { margin-top: 5px; color: var(--detail-muted); font-size: 13px; }
        .approval-detail-root .detail-status { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 8px 13px; background: #fff4d7; color: #916200; font-size: 13px; font-weight: 600; white-space: nowrap; }
        .approval-detail-root .detail-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .approval-detail-root .detail-status.is-approved { background: #e9f7ee; color: #23834b; }
        .approval-detail-root .detail-status.is-rejected { background: #fdeceb; color: #c43c39; }
        .approval-detail-root .detail-paper { background: var(--detail-surface); border: 1px solid var(--detail-border); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px #18243304; }
        .approval-detail-root .detail-paper-header { padding: 28px 30px; border-bottom: 1px solid var(--detail-border); }
        .approval-detail-root .proposal-form-name { margin-bottom: 9px; color: #4263b3; font-size: 13px; font-weight: 600; }
        .approval-detail-root .detail-document-title { margin: 0; font-size: 25px; font-weight: 700; line-height: 1.45; overflow-wrap: anywhere; }
        .approval-detail-root .detail-metadata { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 22px 30px; gap: 22px; border-bottom: 1px solid var(--detail-border); }
        .approval-detail-root .detail-label { display: block; margin-bottom: 8px; color: var(--detail-muted); font-size: 12px; font-weight: 500; }
        .approval-detail-root .detail-value { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
        .approval-detail-root .detail-dates { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 18px 30px; gap: 18px; background: var(--tblr-bg-surface-secondary, #f8fafc); border-bottom: 1px solid var(--detail-border); }
        .approval-detail-root .detail-date { font-size: 13px; font-variant-numeric: tabular-nums; }
        .approval-detail-root .detail-section { padding: 26px 30px; border-bottom: 1px solid var(--detail-border); }
        .approval-detail-root .detail-section:last-child { border-bottom: 0; }
        .approval-detail-root .detail-section-title { margin: 0 0 14px; font-size: 15px; font-weight: 700; }
        .approval-detail-root .detail-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.85; font-size: 14px; }
        .approval-detail-root .detail-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
        .approval-detail-root .detail-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
        .approval-detail-root .detail-summary-item { padding: 18px; border: 1px solid var(--detail-border); border-radius: 8px; background: var(--tblr-bg-surface-secondary, #f8fafc); }
        .approval-detail-root .detail-summary-value { font-size: 18px; font-weight: 700; line-height: 1.5; overflow-wrap: anywhere; }
        .approval-detail-root .detail-period { margin: 16px 0 0; color: var(--detail-muted); font-size: 13px; line-height: 1.6; }
        .approval-detail-root .detail-money { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 20px; border: 1px solid var(--detail-border); border-radius: 8px; background: var(--tblr-bg-surface-secondary, #f8fafc); }
        .approval-detail-root .detail-money strong { font-size: 23px; color: #4263b3; font-variant-numeric: tabular-nums; }
        .approval-detail-root .detail-files { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .approval-detail-root .detail-file { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 14px; border: 1px solid var(--detail-border); border-radius: 8px; background: var(--detail-surface); color: inherit; text-decoration: none; transition: border-color .2s, background-color .2s; }
        .approval-detail-root .detail-file:hover { border-color: #a5b8df; background: var(--tblr-bg-surface-secondary, #f8fafc); color: inherit; text-decoration: none; }
        .approval-detail-root .detail-file:focus-visible { outline: 2px solid #4263b3; outline-offset: 3px; }
        .approval-detail-root .detail-file-icon { display: grid; place-items: center; flex-shrink: 0; width: 40px; height: 44px; border-radius: 7px; background: #edf3ff; color: #4263b3; }
        .approval-detail-root .detail-file-info { flex: 1; min-width: 0; }
        .approval-detail-root .detail-file-name { display: block; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
        .approval-detail-root .detail-file-size { display: block; margin-top: 4px; color: var(--detail-muted); font-size: 12px; }
        .approval-detail-root .detail-file-download { flex-shrink: 0; width: 18px; height: 18px; color: #4263b3; }
        .approval-detail-root .detail-file-count { margin-left: 4px; color: var(--detail-muted); font-weight: 400; }
        .approval-detail-root .detail-empty { margin: 0; color: var(--detail-muted); font-size: 13px; }
        .approval-detail-root .detail-opinion { border-left: 3px solid #a5b8df; padding: 14px 18px; border-radius: 0 6px 6px 0; background: var(--tblr-bg-surface-secondary, #f8fafc); }
        .approval-detail-root .detail-footnote { margin: 16px 0 0; color: var(--detail-muted); font-size: 12px; text-align: right; }
        @media (max-width: 760px) { .approval-detail-root { padding: 16px; } .approval-detail-root .detail-paper-header, .approval-detail-root .detail-section { padding: 22px 20px; } .approval-detail-root .detail-metadata { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 20px; } .approval-detail-root .detail-dates { grid-template-columns: 1fr; padding: 18px 20px; gap: 14px; } .approval-detail-root .detail-files, .approval-detail-root .detail-summary, .approval-detail-root .detail-fields { grid-template-columns: 1fr; } .approval-detail-root .detail-document-title { font-size: 21px; } }
        .approval-detail-root .approval-detail-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 20px 30px; }
        .approval-detail-root .approval-edit-button { display: inline-flex; align-items: center; justify-content: center; min-width: 88px; min-height: 40px; padding: 8px 20px; border: 1px solid var(--tblr-primary, #206bc4); border-radius: 6px; background: transparent; color: var(--tblr-primary, #206bc4); font-size: 14px; font-weight: 600; text-decoration: none; transition: background .15s, color .15s; }
        .approval-detail-root .approval-edit-button:hover { background: var(--tblr-primary, #206bc4); color: #fff; }
        .approval-detail-root .approval-edit-button:focus-visible { outline: 2px solid var(--tblr-primary, #206bc4); outline-offset: 3px; }
        .approval-detail-root .approval-delete-form { margin: 0; }
        .approval-detail-root .approval-delete-button { min-width: 88px; min-height: 40px; padding: 8px 20px; border: 1px solid var(--tblr-danger, #d63939); border-radius: 6px; background: transparent; color: var(--tblr-danger, #d63939); font-size: 14px; font-weight: 600; cursor: pointer; }
        .approval-detail-root .approval-delete-button:hover { background: var(--tblr-danger, #d63939); color: #fff; }
        .approval-detail-root .approval-delete-button:focus-visible { outline: 2px solid var(--tblr-danger, #d63939); outline-offset: 3px; }
        .approval-detail-root .approval-delete-button:disabled { opacity: .5; cursor: not-allowed; }
        /* 결재자 전용 승인 · 반려 입력폼 */
        .approval-detail-root .approval-status-form { margin: 0; padding: 20px; border: 1px solid var(--tblr-border-color, #dadfe5); border-radius: 10px; background: var(--tblr-bg-surface-secondary, #f6f8fb); }
        .approval-detail-root .approval-status-description { margin: 0 0 16px; color: var(--tblr-secondary, #667382); font-size: 13px; line-height: 1.6; }
        .approval-detail-root .approval-status-comment { width: 100%; min-height: 120px; resize: vertical; }
        .approval-detail-root .approval-status-buttons { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 16px; }
        .approval-detail-root .approval-status-buttons .btn { min-width: 88px; min-height: 40px; }
        .approval-detail-root .detail-status.is-other { background: var(--tblr-bg-surface-secondary, #f6f8fb); color: var(--tblr-secondary, #667382); }
        /* 승인 문서: 결재 상태 왼쪽 엑셀 아이콘 */
        .approval-detail-root .approval-status-tools { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .approval-detail-root .approval-excel-icon { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex-shrink: 0; border: 1px solid #b3dcc6; border-radius: 8px; background: #e9f7ee; color: #217346; }
        .approval-detail-root .approval-excel-icon svg { display: block; }
    </style>
    <div class="detail-heading">
        <div>
            <div class="detail-eyebrow">ELECTRONIC APPROVAL</div>
            <div class="detail-document-number" th:text="${'문서 번호 · ' + viewApprovalData.approvalId}"></div>
        </div>
        <div class="approval-status-tools">
            <a class="approval-excel-icon" th:if="${viewApprovalData.approvalStatus == 'APPROVE'}" th:href="@{/downloadProposalExcel(approvalId=${viewApprovalData.approvalId}, keyType=${viewApprovalData.eaType})}" aria-label="기안서 엑셀 다운로드" title="엑셀 다운로드">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="10" y="3" width="11" height="18" rx="2" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M14 8h4M14 12h4M14 16h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <rect x="2" y="6" width="12" height="12" rx="2" fill="currentColor"/>
                    <path d="m5.5 9.5 5 5m0-5-5 5" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
            </a>
            <span class="detail-status" th:classappend="${viewApprovalData.approvalStatus == 'APPROVE' ? 'is-approved' : (viewApprovalData.approvalStatus == 'REJECT' ? 'is-rejected' : (viewApprovalData.approvalStatus == 'PENDING' ? '' : 'is-other'))}" th:text="${viewApprovalData.approvalStatus == 'PENDING' ? '결재 대기' : (viewApprovalData.approvalStatus == 'APPROVE' ? '승인 완료' : (viewApprovalData.approvalStatus == 'REJECT' ? '반려' : '상태 확인 필요'))}">결재 대기</span>
        </div>
    </div>
    <article class="detail-paper">
        <header class="detail-paper-header">
            <div class="proposal-form-name">경위/시말서</div>
            <h2 class="detail-document-title" th:text="${viewApprovalData.factReportTitle}"></h2>
        </header>
        <div class="detail-metadata">
            <div>
                <span class="detail-label">소속 부서</span>
                <div class="detail-value" th:text="${infoByEmployeeId.departmentType != null ? infoByEmployeeId.departmentType : '—'}"></div>
            </div>
            <div>
                <span class="detail-label">소속 팀</span>
                <div class="detail-value" th:text="${infoByEmployeeId.departmentName != null ? infoByEmployeeId.departmentName : '—'}">플랫폼개발팀</div>
            </div>
            <div>
                <span class="detail-label">작성자</span>
                <div class="detail-value" th:text="${viewApprovalData.employeeName != null ? viewApprovalData.employeeName : '—'}"></div>
            </div>
            <div>
                <span class="detail-label">결재자</span>
                <div class="detail-value" th:text="${viewApprovalData.approverName != null ? viewApprovalData.approverName : '—'}"></div>
            </div>
        </div>
        <div class="detail-dates">
            <div>
                <span class="detail-label">작성일시</span>
                <div class="detail-date" th:text="${viewApprovalData.approvalWriteAt != null ? #temporals.format(viewApprovalData.approvalWriteAt, 'yyyy-MM-dd HH:mm:ss') : '—'}"></div>
            </div>
            <div>
                <span class="detail-label">수정일시</span>
                <div class="detail-date" th:text="${viewApprovalData.approvalUpdateAt != null ? #temporals.format(viewApprovalData.approvalUpdateAt, 'yyyy-MM-dd HH:mm:ss') : '—'}"></div>
            </div>
            <div>
                <span class="detail-label">처리일시</span>
                <div class="detail-date" th:text="${viewApprovalData.approvalProcessedAt != null ? #temporals.format(viewApprovalData.approvalProcessedAt, 'yyyy-MM-dd HH:mm:ss') : '—'}"></div>
            </div>
        </div>
        <section class="detail-section">
            <h3 class="detail-section-title">발생 정보</h3>
            <div class="detail-fields">
                <div>
                    <span class="detail-label">발생 일시</span>
                    <div class="detail-value" th:text="${viewApprovalData.factReportOccurrence}"></div>
                </div>
                <div>
                    <span class="detail-label">발생 장소</span>
                    <div class="detail-value" th:text="${viewApprovalData.factReportLocation}"></div>
                </div>
            </div>
        </section>
        <section class="detail-section">
            <h3 class="detail-section-title">발생 경위</h3>
            <p class="detail-text" th:text="${viewApprovalData.factReportInspector}"></p>
        </section>
        <section class="detail-section">
            <h3 class="detail-section-title">원인 및 책임</h3>
            <p class="detail-text" th:text="${viewApprovalData.factReportCause}"></p>
        </section>
        <section class="detail-section">
            <h3 class="detail-section-title">조치 및 재발 방지 대책</h3>
            <p class="detail-text" th:text="${viewApprovalData.factReportCountermeasures}"></p>
        </section>

        <!-- 첨부파일 -->
        <section class="detail-section">
            <h3 class="detail-section-title">첨부파일
                <span class="detail-file-count" th:text="${viewAttachmentList != null ? '(' + #lists.size(viewAttachmentList) + ')' : '(0)'}"></span>
            </h3>
            <div class="detail-files" th:if="${viewAttachmentList != null and !#lists.isEmpty(viewAttachmentList)}">
                <a class="detail-file" th:each="file : ${viewAttachmentList}" th:href="@{/downloadAttachment(attachmentId=${file.attachmentId})}" th:download="${file.originalFileName}" th:aria-label="${file.originalFileName + ' 다운로드'}">
                    <span class="detail-file-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
                    </span>
                    <span class="detail-file-info">
                        <span class="detail-file-name" th:text="${file.originalFileName}"></span>
                        <span class="detail-file-size" th:text="${file.fileSize >= 1048576 ? #numbers.formatDecimal(file.fileSize / 1048576.0, 1, 1) + ' MB' : #numbers.formatDecimal(file.fileSize / 1024.0, 1, 1) + ' KB'}"></span>
                    </span>
                    <svg class="detail-file-download" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/></svg>
                </a>
            </div>
            <p class="detail-empty" th:if="${viewAttachmentList == null or #lists.isEmpty(viewAttachmentList)}">등록된 첨부파일이 없습니다.</p>
        </section>

        <section class="detail-section">
            <h3 class="detail-section-title">결재자 코멘트</h3>

            <!-- 해당 문서의 결재자이며 결재 대기 상태일 때만 처리 가능 -->
            <form class="approval-status-form" th:if="${canProcessApproval}" th:action="@{/updateStatus}" method="post">
                <input type="hidden" name="approvalId" th:value="${viewApprovalData.approvalId}">
                <p class="approval-status-description">코멘트를 입력한 후 승인 또는 반려를 선택해 주세요.</p>
                <label class="form-label" for="factReportApprovalComment">코멘트 <span class="text-secondary fw-normal">(선택)</span></label>
                <textarea class="form-control approval-status-comment" id="factReportApprovalComment" name="approvalComment" rows="4" placeholder="결재 의견이나 반려 사유를 입력하세요" th:text="${viewApprovalData.approvalComment}"></textarea>
                <div class="approval-status-buttons">
                    <button type="submit" class="btn btn-outline-danger" name="approvalStatus" value="REJECT">반려</button>
                    <button type="submit" class="btn btn-success" name="approvalStatus" value="APPROVE">승인</button>
                </div>
            </form>

            <!-- 작성자 또는 이미 처리된 문서에서는 저장된 코멘트만 표시 -->
            <div class="detail-opinion" th:unless="${canProcessApproval}">
                <p class="detail-text" th:text="${viewApprovalData.approvalComment != null and !#strings.isEmpty(viewApprovalData.approvalComment) ? viewApprovalData.approvalComment : '등록된 코멘트가 없습니다.'}"></p>
            </div>
        </section>
        <div class="approval-detail-actions" th:if="${loginEmployee != null and viewApprovalData.writerEmployeeId == loginEmployee.employeeId and viewApprovalData.approvalStatus == 'PENDING'}">
            <a class="btn btn-outline-primary approval-edit-button" th:href="@{/openUpdateApproval(approvalId=${viewApprovalData.approvalId},keyType=${viewApprovalData.eaType})}">수정</a>
            <form class="approval-delete-form" th:action="@{/deleteApproval}" method="post" data-approval-delete-form>
                <input type="hidden" name="approvalId" th:value="${viewApprovalData.approvalId}">
                <button type="submit" class="btn btn-outline-danger approval-delete-button">삭제</button>
            </form>
        </div>
    </article>
    <p class="detail-footnote">전자결재 문서 · 경위/시말서</p>
</section>
</body>
</html>
