<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<header class="navbar navbar-expand-md d-print-none" th:fragment="navbar">
    <div class="container-xl">

        <div class="navbar-nav flex-row order-md-last">

            <!-- 라이트/다크 모드 -->



            <!-- 알림 -->
            <div class="nav-item dropdown">
                <a href="#" class="nav-link px-0" data-bs-toggle="dropdown" aria-label="알림">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 5a2 2 0 1 1 4 0"/>
                        <path d="M5 13h14l-1.5 7h-11z"/>
                        <path d="M9 20a3 3 0 0 0 6 0"/>
                    </svg>
                    <span class="badge bg-red"></span>
                </a>

                <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
                    <div class="dropdown-header">알림</div>
                    <a href="#" class="dropdown-item">새로운 결재 요청이 있습니다.</a>
                    <a href="#" class="dropdown-item">새로운 공지사항이 등록되었습니다.</a>
                </div>
            </div>

            <!-- 사용자 -->
            <div class="nav-item dropdown">
                <a href="#" class="nav-link d-flex lh-1 text-reset p-0 ms-3" data-bs-toggle="dropdown" aria-expanded="false">
                    <img class="avatar avatar-sm" th:if="${loginEmployee != null}" th:src="${loginEmployee.profileImgPath}" alt="프로필 사진">
                    <div class="d-none d-xl-block ps-2">
                        <div th:text="${loginEmployee.employeeName}"></div>
                        <div class="mt-1 small text-secondary">
                            <span th:text="${loginEmployee.departmentName}"></span>
                            ·
                            <span th:if="${loginEmployee.level == 'lv1'}">사원</span>
                            <span th:if="${loginEmployee.level == 'lv2'}">대리</span>
                            <span th:if="${loginEmployee.level == 'lv3'}">과장</span>
                            <span th:if="${loginEmployee.level == 'lv4'}">차장</span>
                            <span th:if="${loginEmployee.level == 'lv5'}">부장</span>
                        </div>
                    </div>
                </a>

                <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
                    <a th:href="@{/openMyPage(loginKey=${loginEmployee.employeeId})}" class="dropdown-item">내 정보</a>
                    <a th:href="@{/openSystemConfig}" class="dropdown-item">설정</a>

                    <div class="dropdown-divider"></div>

                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="dropdown-item">로그아웃</button>
                    </form>
                </div>
            </div>

        </div>

        <!-- 모바일용 -->
        <div class="collapse navbar-collapse">
            <div>
                <h2 class="page-title">그룹웨어</h2>
            </div>
        </div>

    </div>
</header>

</body>
</html>
