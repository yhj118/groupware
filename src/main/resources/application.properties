# application.property: 스프링부트와 DB 연결 인터페이스

spring.application.name=groupware

spring.datasource.hikari.driver-class-name=org.mariadb.jdbc.Driver

# DB 접속할 주소
spring.datasource.hikari.jdbc-url=jdbc:mariadb://localhost:3306/groupware?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
# DB 유저 이름
spring.datasource.hikari.username=root
# DB 유저 비번
spring.datasource.hikari.password=123123
# DB 커넥션 정상 맺어짐 유무
spring.datasource.hikari.connection-test-query=SELECT NOW() FROM dual
# 포트번호 설정
server.port=8081
# 카멜 케이스
mybatis.configuration.map-underscore-to-camel-case=true
# 파일 하나의 최대 크기
spring.servlet.multipart.max-file-size=100MB
# 한 번의 요청 전체 최대 크기
spring.servlet.multipart.max-request-size=300MB
# 접속을 허용할 IP 대역
groupware.network.allowed-cidrs=127.0.0.1/32,::1/128,192.168.219.0/24